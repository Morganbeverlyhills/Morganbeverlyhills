version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: blockchain-sms-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secure_password
      MONGO_INITDB_DATABASE: blockchain_sms
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/init:/docker-entrypoint-initdb.d
    ports:
      - "27017:27017"
    networks:
      - blockchain-sms-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo admin --quiet
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: blockchain-sms-redis
    restart: unless-stopped
    command: redis-server --requirepass redis_password --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - blockchain-sms-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Hardhat Blockchain (Development)
  blockchain:
    image: node:18-alpine
    container_name: blockchain-sms-hardhat
    restart: unless-stopped
    working_dir: /app
    command: npx hardhat node --hostname 0.0.0.0
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "8545:8545"
    networks:
      - blockchain-sms-network
    environment:
      - NODE_ENV=development

  # Main API Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blockchain-sms-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      blockchain:
        condition: service_started
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://admin:secure_password@mongodb:27017/blockchain_sms?authSource=admin
      - REDIS_URL=redis://:redis_password@redis:6379
      - BLOCKCHAIN_RPC_URL=http://blockchain:8545
      - JWT_SECRET=your_super_secret_jwt_key_change_in_production
      - BCRYPT_ROUNDS=12
      - LOG_LEVEL=info
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - QUEUE_REDIS_HOST=redis
      - QUEUE_REDIS_PORT=6379
      - QUEUE_REDIS_PASSWORD=redis_password
    volumes:
      - .:/app
      - /app/node_modules
      - logs:/app/logs
    ports:
      - "3000:3000"
    networks:
      - blockchain-sms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Queue Worker (Background SMS Processing)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blockchain-sms-worker
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
      - blockchain
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://admin:secure_password@mongodb:27017/blockchain_sms?authSource=admin
      - REDIS_URL=redis://:redis_password@redis:6379
      - BLOCKCHAIN_RPC_URL=http://blockchain:8545
      - QUEUE_REDIS_HOST=redis
      - QUEUE_REDIS_PORT=6379
      - QUEUE_REDIS_PASSWORD=redis_password
      - LOG_LEVEL=info
    command: node worker.js
    volumes:
      - .:/app
      - /app/node_modules
      - logs:/app/logs
    networks:
      - blockchain-sms-network

  # Nginx Load Balancer & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: blockchain-sms-nginx
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443"
    networks:
      - blockchain-sms-network

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: blockchain-sms-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - blockchain-sms-network

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: blockchain-sms-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3001:3000"
    networks:
      - blockchain-sms-network

  # Log Management - Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: blockchain-sms-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - blockchain-sms-network

  # Log Management - Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    container_name: blockchain-sms-kibana
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - blockchain-sms-network

  # Database Administration - Mongo Express
  mongo-express:
    image: mongo-express:latest
    container_name: blockchain-sms-mongo-express
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=secure_password
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin_password
    ports:
      - "8081:8081"
    networks:
      - blockchain-sms-network

  # Cache Administration - Redis Commander
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: blockchain-sms-redis-commander
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_HOSTS=local:redis:6379:0:redis_password
    ports:
      - "8082:8081"
    networks:
      - blockchain-sms-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local
  logs:
    driver: local

networks:
  blockchain-sms-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16